[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
kfs = { path = "../kfs" }
vasm = { path = "../vasm" }

[[bin]]
name = "kernel"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
# Built by `cargo xtask test`: report the result through QEMU's isa-debug-exit device.
qemu-test = []
